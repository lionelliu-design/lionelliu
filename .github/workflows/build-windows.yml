name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install pyinstaller tkinterdnd2 pywin32

      - name: Install LibreOffice (to bundle with the app)
        run: choco install libreoffice-still -y --no-progress

      - name: Build exe
        run: >
          pyinstaller --noconsole --onedir --name Doc2Docx
          --collect-all tkinterdnd2
          --hidden-import win32com.client --hidden-import pythoncom
          doc2docx_gui.py

      - name: Bundle LibreOffice next to the exe
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\LibreOffice" "dist\Doc2Docx\LibreOffice" -Recurse
          Remove-Item "dist\Doc2Docx\LibreOffice\help" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Smoke test bundled LibreOffice
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          Set-Content smoke\smoke.txt "hello"
          & "dist\Doc2Docx\LibreOffice\program\soffice.exe" --headless --convert-to docx --outdir smoke smoke\smoke.txt
          if (!(Test-Path smoke\smoke.docx)) { Write-Error "Bundled LibreOffice failed"; exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Doc2Docx -DestinationPath Doc2Docx-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Doc2Docx-win64
          path: Doc2Docx-win64.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Doc2Docx-win64.zip
